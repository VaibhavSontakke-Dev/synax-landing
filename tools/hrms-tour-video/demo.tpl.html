.abtn.hov,.back.hov,.bell.hov{filter:brightness(1.35)}

.stc.blue{background:#16304f;color:#8ec1ff}
.stc.green{background:#12392b;color:#4ade9a}
.stc.amber{background:#3a2d12;color:#f5c04a}

.stc.gray{background:#262626;color:#bdbdbd}

.sbtn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 13px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}

.sbtn.edit{background:#16253a;color:#8ec1ff;border-color:#244770}
.sbtn.ok{background:#12392b;color:#4ade9a;border-color:#1c6a4c}

.sbtn.hov{filter:brightness(1.35)}
.star{color:#f5b82e}
.starm{color:#5a5a5a}
.kpi{border:1px solid #272727;background:#1b1b1b;border-radius:12px}

/* ---------- menus, rings, cursor ---------- */
