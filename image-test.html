<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image Test</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
    .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 20px; max-width: 580px; margin: 20px auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h3 { margin: 0 0 8px; font-size: 1.25rem; color: #0f172a; }
    p { margin: 0 0 16px; font-size: 0.875rem; color: #475569; line-height: 1.5; }
    .label { font-weight: bold; margin-bottom: 8px; color: #2563eb; font-size: 13px; }
    .box { border-radius: 12px; overflow: hidden; border: 1px solid #cbd5e1; background: #000; position: relative; }
    img { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">CURRENT (h: 160px, object-cover object-center) - CROPPED</div>
    <div class="box" style="height: 160px;">
      <img src="public/images/modern-ui.png" style="object-fit: cover; object-position: center;">
    </div>
  </div>

  <div class="card">
    <div class="label">OPTION A: aspect-ratio: 16/9, object-fit: cover</div>
    <div class="box" style="aspect-ratio: 16/9;">
      <img src="public/images/modern-ui.png" style="object-fit: cover; object-position: center;">
    </div>
  </div>

  <div class="card">
    <div class="label">OPTION B: aspect-ratio: 16/10, object-fit: cover</div>
    <div class="box" style="aspect-ratio: 16/10;">
      <img src="public/images/modern-ui.png" style="object-fit: cover; object-position: center;">
    </div>
  </div>

  <div class="card">
    <div class="label">OPTION C: height: 260px (h-64), object-fit: cover, object-position: top center</div>
    <div class="box" style="height: 260px;">
      <img src="public/images/modern-ui.png" style="object-fit: cover; object-position: center top;">
    </div>
  </div>

  <div class="card">
    <div class="label">OPTION D: height: 260px (h-64), object-fit: contain, bg-slate-900</div>
    <div class="box" style="height: 260px; background: #0b1120;">
      <img src="public/images/modern-ui.png" style="object-fit: contain;">
    </div>
  </div>
</body>
</html>
